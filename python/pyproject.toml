[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "veloce-pqc"
version = "1.0.0"
description = "Veloce PQC SDK: pure-Python client for the Lightrider Veloce agent (wolfCrypt FIPS 140-3 cert #4718, ML-KEM, ML-DSA, hybrid TLS 1.3)"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Lightrider Inc" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Security :: Cryptography",
    "License :: Other/Proprietary License",
]

[project.urls]
Homepage = "https://lightriderinc.com"

[tool.setuptools.packages.find]
include = ["veloce*"]
