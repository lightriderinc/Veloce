name: Release

# Builds the click-to-run desktop packages and attaches them to a GitHub
# Release. Push a tag (v1.3.0) or dispatch with a version. The release is
# created as a draft so the owner reviews and publishes it; publishing is
# what makes the assets public and triggers the Zenodo archive.
#
# The Windows and macOS packages are discovery-only: qSearch and the desktop
# UI without the FIPS runtime. The FIPS module is licensed object code that
# never enters CI; full-runtime packages are built on the native release
# hosts (docs/windows.md, docs/macos.md).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version (also the tag, prefixed with v)
        required: true
        default: 1.3.0

permissions:
  contents: write

jobs:
  windows:
    name: Windows x86-64 ZIP and MSI
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          if (-not $v) { $v = "${{ github.ref_name }}".TrimStart("v") }
          "value=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        shell: pwsh
        run: |
          rustup default stable
          python -m pip install -r desktop\requirements-build.txt
          dotnet tool install --global wix --version 5.0.2
      - name: Verify desktop and Windows artifact contracts
        shell: pwsh
        run: python -m pytest -q tests\test_desktop.py tests\test_windows_artifacts.py
      - name: Build portable ZIP, MSI, and checksums
        shell: pwsh
        run: |
          .\installer\windows\build-release.ps1 `
            -Version "${{ steps.version.outputs.value }}" `
            -DiscoveryOnly
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            build/dist/veloce-${{ steps.version.outputs.value }}-windows-x86_64.zip
            build/dist/veloce-${{ steps.version.outputs.value }}-windows-x86_64.msi
            build/dist/SHA256SUMS-windows-x86_64.txt
          if-no-files-found: error

  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ]; then v="${GITHUB_REF_NAME#v}"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          rustup default stable
          python3 -m pip install -r desktop/requirements-build.txt
      - name: Verify desktop and macOS artifact contracts
        run: python3 -m pytest -q tests/test_desktop.py tests/test_macos_artifacts.py
      - name: Detect architecture
        id: arch
        run: echo "value=$(uname -m)" >> "$GITHUB_OUTPUT"
      # Gatekeeper: with the Apple secrets below the DMG is Developer ID
      # signed and notarized and opens without a prompt. Without them the
      # build is ad-hoc signed and the DMG carries "How to open Veloce.txt".
      #   APPLE_CERTIFICATE_P12_BASE64   Developer ID Application cert + key (.p12, base64)
      #   APPLE_CERTIFICATE_PASSWORD     password of that .p12
      #   APPLE_ID, APPLE_TEAM_ID        Apple Developer account and team
      #   APPLE_APP_SPECIFIC_PASSWORD    app-specific password for notarytool
      - name: Prepare Developer ID signing and notarization
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12_BASE64" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            echo "::warning::Apple signing secrets not set; producing an ad-hoc signed DMG that Gatekeeper prompts on first open"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/veloce-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          if [ -z "$identity" ]; then echo "::error::no Developer ID Application identity in the certificate"; exit 1; fi
          xcrun notarytool store-credentials lightrider-notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --keychain "$KEYCHAIN"
          {
            echo "VELOCE_CODESIGN_IDENTITY=$identity"
            echo "VELOCE_NOTARY_PROFILE=lightrider-notary"
            echo "VELOCE_NOTARY_KEYCHAIN=$KEYCHAIN"
            echo "VELOCE_SIGNING_KEYCHAIN=$KEYCHAIN"
          } >> "$GITHUB_ENV"
          echo "Developer ID signing and notarization enabled"
      - name: Build discovery DMG
        run: |
          installer/macos/build-release.sh \
            --version "${{ steps.version.outputs.value }}" \
            --arch "${{ steps.arch.outputs.value }}" \
            --discovery-only
          cd build/dist && shasum -a 256 veloce-*.dmg > SHA256SUMS-macos-${{ steps.arch.outputs.value }}.txt
      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "${VELOCE_SIGNING_KEYCHAIN:-}" ] && [ -f "$VELOCE_SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$VELOCE_SIGNING_KEYCHAIN"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ steps.arch.outputs.value }}
          path: |
            build/dist/veloce-${{ steps.version.outputs.value }}-macos-${{ steps.arch.outputs.value }}.dmg
            build/dist/SHA256SUMS-macos-${{ steps.arch.outputs.value }}.txt
          if-no-files-found: error

  publish:
    name: Draft GitHub Release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          # Not assets/: that is the repository's branding directory.
          path: release-assets
          merge-multiple: true
      - name: Compose release notes
        env:
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          notes="docs/release-notes/${VERSION}.md"
          {
            if [ -f "$notes" ]; then cat "$notes"; else echo "## Veloce PQC SDK ${VERSION}"; fi
            echo
            echo "---"
            echo
            cat docs/windows-quickstart.md
            echo
            echo "---"
            echo
            cat docs/macos-quickstart.md
          } > release-body.md
          ls -la release-assets
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true" ]; then
              gh release upload "$tag" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
              gh release edit "$tag" --notes-file release-body.md --repo "$GITHUB_REPOSITORY"
            else
              # Published releases are immutable deliverables: add only assets
              # that are missing, never replace files or notes.
              existing="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
              for asset in release-assets/*; do
                if ! grep -qx "$(basename "$asset")" <<< "$existing"; then
                  gh release upload "$tag" "$asset" --repo "$GITHUB_REPOSITORY"
                fi
              done
            fi
          else
            gh release create "$tag" release-assets/* \
              --draft \
              --title "Veloce PQC SDK ${VERSION}" \
              --notes-file release-body.md \
              --target "$GITHUB_SHA" \
              --repo "$GITHUB_REPOSITORY"
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,isDraft,assets --jq '{url, isDraft, assets: [.assets[].name]}'
